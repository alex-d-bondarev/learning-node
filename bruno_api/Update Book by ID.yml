info:
  name: Update Book by ID
  type: http
  seq: 4

http:
  method: PUT
  url: "{{app_url}}/{{book_endpoint}}/{{book_id}}"
  body:
    type: json
    data: |-
      {
        "bookName": "Pricy book",
        "countInStock": 32,
        "price": 9876.54,
        "dateCreated": "2026-07-02T21:25:30.395Z",
        "image": "http://example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
