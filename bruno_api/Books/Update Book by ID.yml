info:
  name: Update Book by ID
  type: http
  seq: 1

http:
  method: PUT
  url: "{{app_url}}/{{book_endpoint}}/{{book_id}}"
  headers:
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "bookName": "Bridge Baby",
        "countInStock": -9,
        "price": 99.99,
        "dateCreated": "2026-07-02T21:25:30.395Z",
        "image": "http://example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
