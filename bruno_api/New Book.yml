info:
  name: New Book
  type: http
  seq: 1

http:
  method: POST
  url: "{{app_url}}/{{book_endpoint}}"
  body:
    type: json
    data: |-
      {
        "bookName": "Valid book",
        "countInStock": 50,
        "price": 9.99,
        "image": "https://example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
